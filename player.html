<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Player K-STREAM dengan episode, rating komunitas, komentar, dan riwayat tontonan.">
  <meta name="theme-color" content="#020205">
  <title>Player | K STREAM</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="p-3 md:p-6 lg:p-8">
  <div id="toast-container" class="fixed bottom-6 right-4 z-[100] flex max-w-[calc(100vw-2rem)] flex-col gap-2"></div>

  <header class="glass mx-auto mb-6 flex max-w-[1500px] items-center justify-between gap-3 rounded-2xl border border-white/10 px-4 py-3">
    <a href="./index.html" class="flex items-center gap-2 text-lg font-black tracking-wider">
      <i class="fa-solid fa-play text-pink-500"></i>K STREAM
    </a>
    <div class="flex items-center gap-2">
      <div id="connection-badge"></div>
      <button id="theater-button" class="hidden h-9 w-9 rounded-xl border border-white/10 text-white/60 hover:text-white md:block" title="Mode bioskop">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <main id="watch-layout" class="mx-auto grid max-w-[1500px] gap-6 lg:grid-cols-[minmax(0,1fr)_360px]">
    <div class="space-y-6">
      <section class="media-shell">
        <div class="media-frame relative aspect-video">
          <div id="media-loading" class="absolute inset-0 z-30 flex items-center justify-center bg-black/75">
            <div class="h-11 w-11 animate-spin rounded-full border-4 border-white/15 border-t-pink-500"></div>
          </div>
          <div id="media-empty" class="absolute inset-0 z-20 hidden items-center justify-center bg-black px-6 text-center">
            <div>
              <i class="fa-solid fa-film text-4xl text-pink-400"></i>
              <h2 class="mt-4 text-lg font-bold">Sumber video belum tersedia</h2>
              <p class="mt-2 text-sm text-white/50">Tambahkan URL episode melalui panel admin.</p>
            </div>
          </div>
          <div id="video-wrapper" class="h-full w-full">
            <video id="video-player" class="h-full w-full" playsinline controls preload="metadata"></video>
          </div>
          <div id="embed-wrapper" class="hidden h-full w-full">
            <iframe id="embed-player" class="h-full w-full" title="K-STREAM embedded player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
          </div>
        </div>
      </section>

      <section class="panel rounded-3xl p-5 md:p-7">
        <div class="flex flex-wrap items-start justify-between gap-4">
          <div class="min-w-0">
            <p id="episode-label" class="text-xs font-bold uppercase tracking-[.2em] text-pink-400">Memuat episode</p>
            <h1 id="title" class="mt-2 truncate text-2xl font-black md:text-4xl">Memuat judul...</h1>
            <p id="meta" class="mt-3 text-sm text-white/50"></p>
          </div>
          <div class="flex gap-2">
            <button id="share-button" class="h-10 w-10 rounded-xl border border-white/10 bg-white/[.035] text-white/60 hover:border-pink-500/30 hover:text-white" title="Bagikan">
              <i class="fa-solid fa-share-nodes"></i>
            </button>
            <button id="next-button" class="hidden rounded-xl bg-pink-600 px-4 py-2 text-xs font-bold hover:bg-pink-500">
              Berikutnya <i class="fa-solid fa-forward-step ml-2"></i>
            </button>
          </div>
        </div>
        <p id="synopsis" class="mt-5 text-sm leading-7 text-white/65"></p>

        <div class="mt-6 grid gap-4 border-t border-white/10 pt-5 md:grid-cols-[1fr_auto] md:items-center">
          <div>
            <p class="text-xs font-bold text-white/80">Rating pengguna</p>
            <p id="rating-summary" class="mt-1 text-xs text-white/45">Memuat rating...</p>
          </div>
          <div id="rating-stars" class="flex gap-1.5 text-xl" aria-label="Beri rating">
            <button class="rating-star" data-rating="1" aria-label="1 bintang"><i class="fa-solid fa-star"></i></button>
            <button class="rating-star" data-rating="2" aria-label="2 bintang"><i class="fa-solid fa-star"></i></button>
            <button class="rating-star" data-rating="3" aria-label="3 bintang"><i class="fa-solid fa-star"></i></button>
            <button class="rating-star" data-rating="4" aria-label="4 bintang"><i class="fa-solid fa-star"></i></button>
            <button class="rating-star" data-rating="5" aria-label="5 bintang"><i class="fa-solid fa-star"></i></button>
          </div>
        </div>
      </section>

      <section class="panel rounded-3xl p-5 md:p-7">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-4">
          <div>
            <h2 class="text-lg font-bold">Komentar</h2>
            <p class="mt-1 text-xs text-white/45">Diskusi untuk judul ini.</p>
          </div>
          <div id="community-badge"></div>
        </div>
        <form id="comment-form" class="mt-5 grid gap-3">
          <input id="comment-name" class="input rounded-xl px-4 py-3 text-sm" maxlength="60" required placeholder="Nama Anda">
          <textarea id="comment-text" class="input rounded-2xl px-4 py-3 text-sm" rows="4" maxlength="1200" required placeholder="Tulis komentar..."></textarea>
          <button id="comment-submit" class="justify-self-start rounded-xl bg-pink-600 px-5 py-3 text-xs font-bold hover:bg-pink-500">
            <i class="fa-solid fa-paper-plane mr-2"></i>Kirim komentar
          </button>
        </form>
        <div id="comment-list" class="mt-6 space-y-3"></div>
      </section>
    </div>

    <aside class="space-y-6">
      <section class="panel rounded-3xl p-5">
        <div class="flex items-center justify-between border-b border-white/10 pb-3">
          <h2 class="text-sm font-bold"><i class="fa-solid fa-list-ol mr-2 text-pink-400"></i>Daftar Episode</h2>
          <span id="episode-count" class="text-[10px] font-bold text-white/40">0 episode</span>
        </div>
        <div id="episode-list" class="no-scrollbar mt-4 grid max-h-[420px] grid-cols-2 gap-2 overflow-y-auto"></div>
      </section>

      <section class="panel overflow-hidden rounded-3xl">
        <div class="flex items-center justify-between border-b border-white/10 px-5 py-4">
          <h2 class="text-sm font-bold"><i class="fa-solid fa-clock-rotate-left mr-2 text-pink-400"></i>History Anda</h2>
          <button id="clear-history" class="text-[10px] font-bold text-white/35 hover:text-red-300">Hapus</button>
        </div>
        <div id="history-list" class="no-scrollbar max-h-[420px] overflow-y-auto"></div>
      </section>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/common.js"></script>
  <script src="./js/player.js"></script>
</body>
</html>
